<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Problemica</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="p2.png" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Arial, sans-serif;
  background:#1e1e2f;
  color:white;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

#app { width:95%; max-width:760px; text-align:center; }

.box {
  background:#2a2a40;
  padding:30px;
  border-radius:14px;
  margin-bottom:20px;
}

#start-screen h1 {
  color:#4caf50;
  letter-spacing:2px;
}

#question-text {
  font-size:3.4em;
  margin:25px 0;
  padding:15px;
  border-radius:12px;
  transition:background-color 0.25s ease,color 0.25s ease;
}

.q-correct { background:#2e7d32; color:white; }
.q-wrong   { background:#8e2424; color:white; }

input[type="number"] {
  font-size:1.6em;
  padding:12px;
  width:70%;
  border:none;
  border-radius:8px;
  text-align:center;
}

button {
  margin-top:18px;
  padding:12px 26px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:1em;
}

.primary   { background:#4caf50; color:white; }
.secondary { background:#2196f3; color:white; }
.danger    { background:#455a64; color:white; }
.hidden    { display:none; }

canvas {
  background:white;
  border-radius:10px;
  margin-top:25px;
}

.op-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin:20px 0;
}

.op-tile {
  background:#1f1f33;
  border:2px solid #444;
  border-radius:12px;
  font-size:2.6em;
  padding:25px 0;
  cursor:pointer;
  user-select:none;
  transition:0.2s;
}

.op-tile:hover { background:#2e2e50; }
.op-tile.selected {
  background:#4caf50;
  border-color:#4caf50;
  color:black;
}
.op-tile input { display:none; }

.diff-grid {
  display:flex;
  justify-content:center;
  gap:15px;
  margin:15px 0;
}

.diff-tile {
  background:#1f1f33;
  border:2px solid #444;
  border-radius:12px;
  font-size:1.6em;
  padding:15px 25px;
  cursor:pointer;
  user-select:none;
  transition:0.2s;
}

.diff-tile:hover { background:#2e2e50; }
.diff-tile.selected {
  background:#4caf50;
  border-color:#4caf50;
  color:black;
}
</style>
</head>

<body>
<div id="app">

<div id="start-screen" class="box">
  <h1>PROBLEMICA</h1>
  <p>Adaptive Arithmetic Trainer</p>

  <h3>Select Operations</h3>
  <div class="op-grid">
    <label class="op-tile"><input type="checkbox" value="+">+</label>
    <label class="op-tile"><input type="checkbox" value="-">−</label>
    <label class="op-tile"><input type="checkbox" value="*">×</label>
    <label class="op-tile"><input type="checkbox" value="/">÷</label>
  </div>

  <h3>Select Difficulty</h3>
  <div class="diff-grid">
    <div class="diff-tile" data-rate="0.05">Easy</div>
    <div class="diff-tile" data-rate="0.10">Normal</div>
    <div class="diff-tile" data-rate="0.20">Hard</div>
  </div>

  <button class="primary" id="start-btn">Start</button>
</div>

<div id="quiz-screen" class="box hidden">
  <div id="question-number"></div>
  <div id="question-text"></div>
  <input type="number" id="answer-input" autocomplete="off">
  <button class="danger" id="finish-btn">Finish</button>
</div>

<div id="result-screen" class="box hidden">
  <h2>Results</h2>
  <p>Score: <span id="score-out"></span></p>
  <p>Accuracy: <span id="accuracy-out"></span>%</p>
  <p>CPM: <span id="cpm-out"></span></p>

  <h3>Mistakes</h3>
  <ul id="mistakes-list"></ul>

  <canvas id="combinedChart"></canvas>

  <div style="display:flex;justify-content:center;gap:15px;margin-top:15px;">
    <button class="secondary" id="retry-btn">Try Again</button>
    <button class="primary" id="return-btn">Return to Main Screen</button>
  </div>
</div>

</div>

<script>
const startBtn = document.getElementById("start-btn");
const finishBtn = document.getElementById("finish-btn");
const retryBtn = document.getElementById("retry-btn");
const returnBtn = document.getElementById("return-btn");
const input = document.getElementById("answer-input");

const startScreen = document.getElementById("start-screen");
const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");

const opTiles = document.querySelectorAll(".op-tile");
const diffTiles = document.querySelectorAll(".diff-tile");

const correctSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3");
const wrongSound   = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3");

let selectedOps = [];
let difficultyRate = 0.05;

let score = 0;
let answered = 0;
let questionIndex = 0;
let difficultyFactor = 100;

const minDigits = 2;
const maxDigits = 9;

let startTime;
let current = {};
let mistakes = [];
let labels = [];
let cpmHistory = [];
let chart;

// Operation weights for adaptive frequency
let opWeights = {"+":1,"-":1,"*":1,"/":1};

opTiles.forEach(tile=>{
  tile.addEventListener("click", ()=>{
    const i = tile.querySelector("input");
    i.checked = !i.checked;
    tile.classList.toggle("selected", i.checked);
  });
});

diffTiles.forEach(tile=>{
  tile.addEventListener("click", ()=>{
    if(tile.classList.contains("selected")){
      tile.classList.remove("selected");
      difficultyRate = 0.05;
    } else {
      diffTiles.forEach(t=>t.classList.remove("selected"));
      tile.classList.add("selected");
      difficultyRate = parseFloat(tile.dataset.rate);
    }
  });
});

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

// pick operation based on weights
function pickOperation() {
  const ops = selectedOps.map(op => ({op, weight: opWeights[op]}));
  const total = ops.reduce((sum,o)=>sum+o.weight,0);
  let r = Math.random() * total;
  for (let o of ops) {
    if (r < o.weight) return o.op;
    r -= o.weight;
  }
  return ops[0].op;
}

function generateQuestion(){
  const op = pickOperation();
  let a,b;

  if(op==="+"||op==="-"){
    const min = 10**(minDigits-1);
    const max = 10**maxDigits-1;
    a = clamp(Math.floor(Math.random()*difficultyFactor*2)+1,min,max);
    b = clamp(Math.floor(Math.random()*difficultyFactor*2)+1,min,max);
  } else {
    const max = Math.floor(difficultyFactor/10)+1;
    a = Math.floor(Math.random()*max)+1;
    b = Math.floor(Math.random()*max)+1;
    if(op==="/") a = a*b;
  }

  current = {a,b,op};

  document.getElementById("question-number").textContent = `Question ${questionIndex+1}`;
  document.getElementById("question-text").textContent = `${a} ${op} ${b}`;

  input.value="";
  input.focus();
}

function correctAnswer(){
  const {a,b,op} = current;
  if(op==="+") return a+b;
  if(op==="-") return a-b;
  if(op==="*") return a*b;
  if(op==="/") return a/b;
}

input.addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;

  const user = Number(input.value);
  if(isNaN(user)) return;

  const correct = correctAnswer();
  answered++;

  const qBox = document.getElementById("question-text");
  qBox.classList.remove("q-correct","q-wrong");

  if(user===correct){
    score++;
    difficultyFactor *= Math.exp(difficultyRate);
    // decrease weight slightly for correct answers
    opWeights[current.op] *= 0.95;
    qBox.classList.add("q-correct");
    correctSound.play();
  } else {
    difficultyFactor *= Math.exp(-difficultyRate);
    // increase weight slightly for wrong answers
    opWeights[current.op] *= 1.2;
    mistakes.push(`${current.a} ${current.op} ${current.b} = ${correct}`);
    qBox.classList.add("q-wrong");
    wrongSound.play();
  }

  // clamp difficulty and weights
  difficultyFactor = clamp(difficultyFactor, 10**(minDigits-1), 10**maxDigits-1);
  for (let op in opWeights) opWeights[op] = clamp(opWeights[op],0.1,10);

  const elapsed = (Date.now()-startTime)/60000;
  const cpm = Math.round(score/elapsed);

  labels.push(questionIndex+1);
  cpmHistory.push(cpm);
  questionIndex++;

  setTimeout(()=>{
    qBox.classList.remove("q-correct","q-wrong");
    generateQuestion();
  },350);
});

startBtn.onclick = ()=>{
  selectedOps = [...document.querySelectorAll(".op-tile input:checked")].map(i=>i.value);
  if(selectedOps.length===0){
    selectedOps=["+","-","*","/"];
    opTiles.forEach(t=>{
      t.classList.add("selected");
      t.querySelector("input").checked=true;
    });
  }

  const diff = document.querySelector(".diff-tile.selected");
  difficultyRate = diff ? parseFloat(diff.dataset.rate) : 0.10;

  score=answered=questionIndex=0;
  difficultyFactor=100;
  mistakes=[];
  labels=[];
  cpmHistory=[];
  startTime=Date.now();

  // reset operation weights
  opWeights = {};
  selectedOps.forEach(op => opWeights[op] = 1);

  startScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  generateQuestion();
};

finishBtn.onclick = ()=>{
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");

  const elapsed=(Date.now()-startTime)/60000;
  document.getElementById("score-out").textContent=`${score}/${answered}`;
  document.getElementById("accuracy-out").textContent=answered?Math.round(score/answered*100):0;
  document.getElementById("cpm-out").textContent=Math.round(score/elapsed);

  const list=document.getElementById("mistakes-list");
  list.innerHTML="";
  mistakes.forEach(m=>{
    const li=document.createElement("li");
    li.textContent=m;
    list.appendChild(li);
  });

  if(chart) chart.destroy();
  chart=new Chart(document.getElementById("combinedChart"),{
    type:"line",
    data:{
      labels,
      datasets:[{
        label:"Correct Calculations Per Minute",
        data:cpmHistory,
        borderColor:"cyan",
        backgroundColor:"rgba(0,255,255,0.2)",
        fill:true,
        tension:0.3
      }]
    }
  });
};

retryBtn.onclick=()=>{
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  score=answered=questionIndex=0;
  difficultyFactor=100;
  mistakes=[];
  labels=[];
  cpmHistory=[];
  startTime=Date.now();

  // reset weights
  opWeights = {};
  selectedOps.forEach(op => opWeights[op] = 1);

  generateQuestion();
};

returnBtn.onclick=()=>{
  resultScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
  chart?.destroy();
  opTiles.forEach(t=>{
    t.classList.remove("selected");
    t.querySelector("input").checked=false;
  });
  diffTiles.forEach(t=>t.classList.remove("selected"));
};
</script>

</body>
</html>
